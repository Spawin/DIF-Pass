name: "Bump app version"

run-name: 'Bump app version (${{ inputs.bump }}) by ${{ github.actor }}'

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Type de bump de version (versionName + build number, voir pubspec.yaml)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

jobs:
  bump:
    name: Bump version via cider
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@f0ead981b4d9a35b37f30d36160575d60931ec30 # v1.6.4

      - name: Activer cider
        run: dart pub global activate cider

      - name: Bump ${{ inputs.bump }}
        id: bump
        run: |
          dart pub global run cider bump ${{ inputs.bump }}
          new_version=$(dart pub global run cider version)
          echo "NEW_VERSION=$new_version" >> "$GITHUB_OUTPUT"

      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump version to ${{ steps.bump.outputs.NEW_VERSION }}"
          git push
